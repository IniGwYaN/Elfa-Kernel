name: Build Elfa kernel (Poco F1 beryllium)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "beryllium"
  DEVICE_CODENAME : "beryllium"

  CUSTOM_CMDS : ""
  EXTRA_CMDS : "KCFLAGS=-Wno-error"

  KERNEL_SOURCE : "https://github.com/IniGwYaN/android_kernel_xiaomi_sdm845.git"
  KERNEL_BRANCH : "v0.5.5-playtest"

  CLANG_SOURCE : ""
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-gnu-4.9.git"
  GCC_64_BRANCH : "android-4.9"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-gnueabihf-4.9.git"
  GCC_32_BRANCH : "android-4.9"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/mi845_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "bakasu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineage20_a13"

  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/xiaomi/beryllium.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: POCO F1 beryllium (LineageOS 20, kernel 4.9)
    runs-on: ubuntu-24.04
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install sudo
        run: |
          apt-get update
          apt-get install -y sudo

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options (perf/adem/ram)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          KCFG=arch/arm64/configs/vendor/xiaomi/beryllium.config
          add() { grep -qxF "$1" "$KCFG" || echo "$1" >> "$KCFG"; }
          add 'CONFIG_CPU_FREQ_GOV_INTERACTIVE=y'
          add 'CONFIG_MSM_PERFORMANCE=y'
          add 'CONFIG_CPU_BOOST=y'
          add 'CONFIG_IOSCHED_DEADLINE=y'
          add 'CONFIG_IOSCHED_ANXIETY=y'
          add 'CONFIG_IOSCHED_MAPLE=y'
          add 'CONFIG_IOSCHED_ZEN=y'
          add 'CONFIG_IOSCHED_TRIPNDROID=y'
          add 'CONFIG_IOSCHED_FIOPS=y'
          add 'CONFIG_IOSCHED_SIO=y'
          add 'CONFIG_DEFAULT_IOSCHED="zen"'
          add 'CONFIG_TCP_CONG_WESTWOOD=y'
          add 'CONFIG_DEFAULT_TCP_CONG="westwood"'
          add 'CONFIG_SCHED_AUTOGROUP=y'
          add 'CONFIG_ZRAM=y'
          add 'CONFIG_ZSMALLOC=y'
          add 'CONFIG_SWAP=y'
          add 'CONFIG_CLEANCACHE=y'
          add 'CONFIG_THERMAL_GOV_POWER_ALLOCATOR=y'
          add 'CONFIG_QTI_THERMAL_LIMITS_DCVS=n'
          add 'CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y'
          add 'CONFIG_HZ_300=y'
          add 'CONFIG_ZRAM_WRITEBACK=y'

      - name: Built-in perf defaults
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i 's/#define DEFAULT_GO_HISPEED_LOAD 99/#define DEFAULT_GO_HISPEED_LOAD 85/' drivers/cpufreq/cpufreq_interactive.c
          sed -i 's/(80 \* USEC_PER_MSEC)/(40 * USEC_PER_MSEC)/' drivers/cpufreq/cpufreq_interactive.c
          sed -i 's/int vm_swappiness = 60;/int vm_swappiness = 120;/' mm/vmscan.c

      - name: GPU LMH unlock (fix GPU stuck at 257MHz)
        run: |
          cd $GITHUB_WORKSPACE
          cp gpu_lmh_unlock.c device_kernel/drivers/thermal/qcom/msm_lmh_dcvs.c
          echo '[+] Applied GPU LMH unlock'

      - name: Backport extra I/O schedulers
        run: |
          bash $GITHUB_WORKSPACE/misc/iosched_prep.sh

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
