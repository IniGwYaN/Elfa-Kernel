name: Consolidate (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Elfa
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Backup harness files
        run: |
          set -e
          mkdir -p /tmp/harness
          cp -a .github Bin Patches misc gpu_lmh_unlock.c README.md /tmp/harness/

      - name: Import kernel source (fork @ a7809bd68e)
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /tmp
          git clone --depth 1 --single-branch -b v0.5.5-playtest \
            https://x-access-token:${TOK}@github.com/IniGwYaN/android_kernel_xiaomi_sdm845.git ksrc
          cd $GITHUB_WORKSPACE
          rsync -a --exclude='.git' /tmp/ksrc/ ./
          cp -a /tmp/harness/. ./
          rm -rf /tmp/ksrc

      - name: Guard against files > 100MB
        run: |
          BIG=$(find . -type f -size +100M -not -path './.git/*')
          if [ -n "$BIG" ]; then echo "FATAL: files >100MB:"; echo "$BIG"; exit 1; fi
          echo "OK: no file >100MB"

      - name: Commit & push
        run: |
          set -e
          git config user.email "81572430+IniGwYaN@users.noreply.github.com"
          git config user.name "YAN"
          git add -A
          git commit -m "Consolidate: fold kernel source (fork@a7809bd68e) into single full repo" || echo "nothing to commit"
          git push origin HEAD:main
